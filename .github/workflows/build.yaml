name: Build and Release
permissions:
  contents: read

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
      - 'v*.*.*-legacy'
      - 'v*.*.*-legacy.*'
      - 'v*.*.*-es5'
      - 'v*.*.*-es5.*'
      - 'v*.*.*-beta'
      - 'v*.*.*-beta.*'
      - 'v*.*.*-alpha'
      - 'v*.*.*-alpha.*'
      - 'v*.*.*-rc'
      - 'v*.*.*-rc.*'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check Event Type
        id: check-event
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "EVENT_TYPE=tag" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)(\.[0-9]+)?$ ]]; then
              echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
            else
              echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
            fi
            echo "TARGET_COMMITISH=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "EVENT_TYPE=push" >> "$GITHUB_OUTPUT"
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
            echo "TARGET_COMMITISH=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set-up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install deps
        run: pnpm install
      - name: E2E tests
        run: pnpm test:all
      - name: Create coverage
        run: pnpm coverage:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: |
            playwright-report/
            coverage/
          retention-days: 30
      - name: Update draft release
        if: steps.check-event.outputs.EVENT_TYPE == 'push'
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create tagged release
        if: steps.check-event.outputs.EVENT_TYPE == 'tag'
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          publish: true
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.check-event.outputs.PRERELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets
        if: steps.check-event.outputs.EVENT_TYPE == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/kiosk-mode.js
            dist/kiosk-mode-es5.js